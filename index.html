<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AutomaLab: construa, visualize e simule autômatos finitos determinísticos e não determinísticos passo a passo."
    />
    <title>AutomaLab</title>
    <script>
      // Aplica o tema antes do primeiro desenho para evitar piscada de cor.
      try {
        var storedTheme = localStorage.getItem('automalab:theme')
        if (
          storedTheme !== 'claro' &&
          storedTheme !== 'escuro' &&
          storedTheme !== 'alto-contraste'
        ) {
          storedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'escuro'
            : 'claro'
        }
        document.documentElement.dataset.theme = storedTheme
      } catch (error) {
        document.documentElement.dataset.theme = 'claro'
      }
    </script>
    <script type="module" crossorigin src="/assets/index-CLgazrRF.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CjOBuvWA.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
